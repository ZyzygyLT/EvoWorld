[project]
name = "worldsim"
version = "0.1.0"
description = "Fantasy world generator & civilization simulator — rescue of Dozed12/df-style-worldgen"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "tcod>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
png = [
    "pillow>=10.0",
]

[project.scripts]
worldsim = "worldsim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldsim"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "clients"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
