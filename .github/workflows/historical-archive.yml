name: Historical archive checks

on:
  push:
    branches:
      - feature/historical-archive-local
  pull_request:
    branches:
      - feature/evoworld-review

permissions:
  contents: read

jobs:
  historical-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pytest
        run: python -m pip install pytest
      - name: Test read-only SQLite exporter
        env:
          PYTHONPATH: src:.
        run: python -m pytest -q tests/test_historical_archive_export.py
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Test archive adapter
        working-directory: web
        run: npm run test:archive
      - name: Build web client
        working-directory: web
        run: npm run build
